syntax = "proto3";

package recipe_modules.chromeos.auto_retry_util;

message AutoRetryUtilProperties {

  // The window in which we will consider CLs that have recently been labeled.
  // Default: 1 day (86400 seconds).
  uint32 lookback_seconds = 1;

  // The maximum number of builds to place in the description of the retry.
  // Default: 5.
  uint32 builds_comment_limit = 2;

  // The maximum number of suites to place in the description of the retry.
  // Default: 5.
  uint32 suites_comment_limit = 3;

  // If true, actually retry the CLs. By default, the retrier will just analyze
  // candidate CLs but not take action on them.
  bool enable_retries = 4;

  // The list of service accounts used by auto retry.
  // e.g. 'chromeos-auto-retry@chromeos-bot.iam.gserviceaccount.com'
  repeated string service_accounts = 5;
}
