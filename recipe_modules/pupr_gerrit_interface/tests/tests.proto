syntax = "proto3";

package recipe_modules.chromeos.pupr_gerrit_interface.tests.tests;

import "go.chromium.org/luci/buildbucket/proto/common.proto";
import "recipes/chromeos/generator.proto";

message ApplyRetryPolicyProperties {
  recipes.chromeos.generator.SendToCqPolicy existing_cls_policy = 1;
  recipes.chromeos.generator.SendToCqPolicy no_existing_cls_policy = 2;
  recipes.chromeos.generator.RetryClPolicy retry_cl_policy = 3;
  recipes.chromeos.generator.OutdatedClsPolicy outdated_cls_policy = 4;
  bool retry_only = 5;
  bool rebase_before_retry = 6;
  int32 changes = 7;
  int32 max_concurrent_cq_runs = 8;
}

message CreateUprevClsProperties {
  recipes.chromeos.generator.SendToCqPolicy send_to_cq_policy = 1;
  bool existing_cls = 2;
  int32 projects = 3;
  recipes.chromeos.generator.CrPolicy cr_policy = 4;
  int32 max_concurrent_cq_runs = 5;
  repeated buildbucket.v2.GerritChange open_changes = 6;
}

message FindOpenUprevCLsProperties {
  repeated buildbucket.v2.GerritChange expected_gerrit_changes = 1;
}

message HandleOutdatedChangesProperties {
  recipes.chromeos.generator.OutdatedClsPolicy outdated_cls_policy = 1;
  bool expected = 2;
  bool retry_only = 3;
  int32 changes = 4;
}

message HandleRepeatedlyFailingChangesProperties {
  repeated buildbucket.v2.GerritChange open_changes = 1;
  int32 max_cq_retry = 2;
  repeated int32 expected_remaining_changes_number = 3;
  bool should_count_dry_run = 4;
}
