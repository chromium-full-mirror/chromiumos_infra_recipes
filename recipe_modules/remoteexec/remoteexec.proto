syntax = "proto3";

package recipe_modules.chromeos.remoteexec;

import "chromiumos/common.proto";

message RemoteexecProperties {
  // cipd rbe client version to ensure.
  string reclient_version = 1;
  // file of the config that should be passed when calling reproxy.
  string reproxy_cfg_file = 2;
}