syntax = "proto3";

package recipe_modules.chromeos.looks_for_green;

message LooksForGreenProperties {
  // Whether to actually look-for-green.
  // Used to flag the feature and unittesting.
  bool enable_looks_for_green = 1;

  // Whether to run in dry_run mode. Looks-for-green logic will be
  // executed but snapshot won't be changed.
  bool dry_run = 2;

  // Maximum hours to look back for a known-green snapshot.
  int32 lookback_hours = 3;

  // Threshold at which a snapshot is called "green". Score is assigned by the
  // greenness module - greenness is [0,100].
  int32 greenness_threshold = 4;
}

message LooksForGreenStats {
  // Whether the latest snapshot-orchestrator is green compared to greenness_threshold.
  bool is_snap_orch_green = 1;

  // Aggregate greenness (set in output props by greennness module) of latest
  // snapshot-orchestrator.
  int32 snap_orch_greenness = 2;

  // BBID of latest snapshot-orchestrator.
  int64 snap_orch_bbid = 3;

  // Approximate age of snapshot manifest tested with latest
  // snapshot-orchestrator.
  int32 approx_snap_age_hours = 4;

  // SHA of snapshot manifest tested with latest snapshot-orchestrator.
  string snap_commit_sha = 5;
}
