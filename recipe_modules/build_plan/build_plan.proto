syntax = "proto3";

package recipe_modules.chromeos.build_plan;

message BuildPlanProperties {
  // Whether to disable any pruning of necessary builds in get_build_plan.
  bool disable_build_plan_pruning = 1;

  // Whether to honor slim builders' criticality.
  bool honor_slim_builder_criticality = 2;

  // The builder names of the additional Chrome PUpr Uprev builders.
  repeated string additional_chrome_pupr_builders = 3;
}
