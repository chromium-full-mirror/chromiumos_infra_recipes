syntax = "proto3";

package recipe_modules.chromeos.failures;

import "chromiumos/common.proto";

message PackageFailure {

  enum Phase {
    UNSPECIFIED = 0;
    COMPILE = 1;
    TEST = 2;
  }

  // The package which failed.
  chromiumos.PackageInfo package = 1;

  // The build phase during which the package failed to emerge.
  Phase phase = 2;
}