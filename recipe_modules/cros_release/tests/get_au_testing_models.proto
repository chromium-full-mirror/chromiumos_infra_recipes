syntax = "proto3";

package recipe_modules.chromeos.cros_release.tests;

message GetAuTestingModelsProperties {
  // Whether to get FSI-payload testing models.
  bool fsi = 1;
  // List of models that should be returned by get_au_testing_models (not
  // necessarily in the same order).
  repeated string expected_models = 2;
}