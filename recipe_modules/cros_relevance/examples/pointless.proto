syntax = "proto3";

package recipe_modules.chromeos.cros_relevance.examples;

import "go.chromium.org/luci/buildbucket/proto/common.proto";

message PointlessTest {
  // The gerrit changes to use.
  repeated buildbucket.v2.GerritChange gerrit_changes = 1;

  // The expected return from is_build_pointless.
  bool expected = 2;
}
