syntax = "proto3";

package recipe_modules.chromeos.cros_signing;

message CrosSigningProperties {
  // Timeout for waiting for signing to fully complete (in seconds) for all
  // signing operations.
  int32 timeout = 1;

  // How long to sleep between polls (in seconds).
  int32 sleep_duration = 2;
}
