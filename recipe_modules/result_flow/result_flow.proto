syntax = "proto3";

package recipe_modules.chromeos.result_flow;

message ResultFlowModuleProperties {
  // Version describes which result_flow binary version to use.
  message Version {
    // Use the CIPD version with this label.
    string cipd_label = 1;
  }

  Version version = 1;
}