syntax = "proto3";

package recipe_modules.chromeos.cros_artifacts.examples;

import "chromite/api/artifacts.proto";

message TestInputProperties {
  // Expected relevance
  chromite.api.PrepareForBuildResponse.BuildRelevance relevance = 1;

  // Override Build API version.
  string build_api_version = 2;

  // Test_data for Build API call.
  string api_response = 3;

  // Whether or not the build is failing.
  bool failing_build = 4;

  // Whether or not to set publish_conditions to PUBLISH_ALWAYS.
  bool publish_always = 5;
}
