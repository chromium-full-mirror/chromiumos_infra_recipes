syntax = "proto3";

package recipe_modules.chromeos.bot_cost.examples;

import "chromiumos/common.proto";

message TestProperties {
  // name for the test and step.
  string name = 1;

  // bot size
  string bot_size = 2;

  // Whether we expect non-zero cost.
  bool expect_cost = 3;
}

