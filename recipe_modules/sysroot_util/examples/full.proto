syntax = "proto3";

package recipe_modules.chromeos.sysroot_util.examples;

import "chromiumos/common.proto";

message FullTestProperties {
  // Image types to build.
  repeated chromiumos.ImageType image_types = 1;

  // ImageService.Test response JSON.
  string image_test_json = 2;

  // Whether this is an artifact build
  bool artifact_build = 3;
}
