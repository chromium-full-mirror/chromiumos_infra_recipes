syntax = "proto3";

package recipe_modules.chromeos.skylab;

message SkylabProperties {
  string ctp_builder = 5;
  string skylab_server = 1;
  string skylab_version = 2;
  string skylab_qs_account = 3;
  int32 skylab_priority = 4;
  reserved 6, 7, 8;

  // TODO(b/209497087): Experiment flag to enable passing container information
  // to CTP, remove once support is stabilized.
  bool enable_container_support = 9;

  // Set to true if the ResultDB invocations for scheduled CTP builds should NOT
  // be included in the ResultDB invocation for the current build. Defaults to
  // false (i.e. defaults to including scheduled CTP builds in the current
  // build's ResultRB invocation).
  bool exclude_sub_invs = 10;

  // Projects which have direct Tast testing enabled.
  repeated string direct_tast_testing_projects = 11;

  // Projects which are blocklisted from direct Tast testing.
  repeated string direct_tast_testing_blocklist_projects = 12;

  // If set, build targets in `custom_qs_build_target_allowlist` will be
  // scheduled using this QS account instead of `skylab_qs_account`.
  // Used to deprioritize variant boards, see b/321723795 for context.
  string custom_qs_account = 13;

  // Build targets to schedule with the `custom_qs_account` qs account.
  repeated string custom_qs_account_build_target_allowlist = 14;
}
