syntax = "proto3";

package recipe_modules.chromeos.conductor;

import "chromiumos/conductor.proto";

message ConductorProperties {
  reserved 1;
  reserved 2;

  // If set, will use the conductor for child builds scheduling
  // instead of the native buildbucket collect function.
  bool enable_conductor = 3;

  // Whether to pass --dryrun to the conductor.
  bool conductor_dryrun = 6;

  // Seconds to wait between polling builders.
  int32 polling_interval_seconds = 4;

  // Maps collect names to CollectConfigs.
  // Collect names are strings used to identify different collects throughout
  // the lifetime of the build.
  map<string, chromiumos.CollectConfig> collect_configs = 5;
}
