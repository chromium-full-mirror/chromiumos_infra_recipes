syntax = "proto3";

package recipe_modules.chromeos.support;

message SupportProperties {
  // Cipd ref to use for support.
  // Defaults to "chromiumos/infra/support/{$platform}".
  string support_cipd_package = 1;

  // Cipd ref to use for support.
  // Defaults to "staging" or "prod".
  string support_cipd_ref = 2;
}
