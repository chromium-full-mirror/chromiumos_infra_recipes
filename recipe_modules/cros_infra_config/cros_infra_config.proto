syntax = "proto3";

package recipe_modules.chromeos.cros_infra_config;

message CrosInfraConfigProperties {
  // For testing, this is a reference to what refspec to use when fetching.
  // {CONFIG}.binaryproto.  Example values:
  // - '': tip-of-tree (default)
  // - 'refs/changes/80/2472480/2': patchset 2 of crrev.com/i/2472480
  // - 'refs/changes/FG/NNNNNFG/PP': patchset PP of crrev.com/i/NNNNNFG
  // This may be propogated to spawned builders.
  // Note: If config_ref starts with 'refs/changes/', then the binaryproto
  // config is generated from the jsonpb (.cfg) file in the gerrit change.
  // (Saving the developer from needing to generate the binaryproto files in
  // their CL.)
  //
  // THIS IS ONLY USED BY STAGING BUILDERS.
  //
  string config_ref = 1;

  // Whether to ignore the changelist in the builder config.
  bool ignore_config_changelist = 2;

  // Whether public builders should sync to the public manifest.
  bool switch_to_external_manifest = 3;

  // Feature flag: whether to honor gitiles_commit.ref when forcing host
  // and project to the manifest.
  bool honor_gitiles_commit_ref = 4;

  // Feature flag: build ToT release builds from the snapshot manifest.
  bool release_tot_builds_snapshot = 5;
}
