syntax = "proto3";

package recipe_modules.chromeos.cros_tool_runner;

import "chromiumos/build/api/container_metadata.proto";

message CrosToolRunnerProperties {
    // Version describes which cros-tool-runner binary version to use.
    message Version {
        // Use the CIPD version with this label.
        string cipd_label = 1;
    }

    Version version = 1;
    chromiumos.build.api.ContainerMetadata container_metadata = 2;
}

message CrosToolRunnerEnvProperties {
    string SWARMING_BOT_ID = 1;
    string SWARMING_TASK_ID = 2;
    string SKYLAB_DUT_ID = 3;
}
