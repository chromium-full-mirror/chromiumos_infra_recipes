syntax = "proto3";

package recipe_modules.chromeos.repo;

message RepoProperties {

  // Feature flag: toggle the source cache health feature
  bool disable_source_cache_health = 1;

  reserved 2;

  // Whether to disable verification of repo.  This allows testing of repo
  // changes before they are tagged.
  bool disable_repo_verify = 3;

  // Repo url to use when not provided by the caller.  Defaults to the URL
  // internal to the repo launcher being used.
  string default_repo_url = 4;

  // Repo branch/revision for the repo source itself.  Defaults to the stable
  // branch (specified by repo itself).
  string default_repo_rev = 5;

  // How many commits to fetch from the manifest repository.  Defaults to all
  // (which is the same as 0).  Usually only useful to specify 1 here.
  uint32 default_manifest_depth = 6;
}
