syntax = "proto3";

package recipe_modules.chromeos.orch_menu.examples;

message FullProperties {
  // Value for setup_orchestrator(missing_ok) parameter.
  bool missing_ok = 1;

  // Whether to expect a missing config.
  bool expect_missing_config = 2;

  // Test footers to pass to git_footers.  This is a newline separated string of
  // footer values.
  string test_footers = 3;

  // The expected list build_pb2.Build() entries in completed_builds, JSON
  // encoded.
  repeated string expected_completed_builds = 4;
}
