syntax = "proto3";

package recipe_modules.chromeos.lfg_util.examples;

message CQDependsIncludedProperties {
  bool expected_result = 1;
  repeated int32 change_ids = 2;
}

message LatestSubmittedTimeProperties {
  string expected_result = 1;
  repeated int32 change_ids = 2;
  bool expected_submission = 3;
}
