syntax = "proto3";

package recipe_modules.chromeos.git.examples;

import "go.chromium.org/luci/buildbucket/proto/common.proto";

message FetchProperties {
  // The head commit to use.
  buildbucket.v2.GitilesCommit snapshot = 1;

  // The count to pass.
  int32 count = 2;

  // The expected list of commit shas
  repeated string expected_shas = 3;
}
