syntax = "proto3";

package recipe_modules.chromeos.cros_release_config;

import "chromiumos/common.proto";

message CrosReleaseConfigProperties {
  // Reviewers (emails) for config CLs.
  repeated string reviewers = 1;

  // CCs (emails) for config CLs.
  repeated string ccs = 2;

}