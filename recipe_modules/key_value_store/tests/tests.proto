syntax = "proto3";

package recipe_modules.chromeos.key_value_store.tests;

message ParseProperties {
  string contents = 1;
  string expected_json_str = 2;
}

message UpdateOneValueProperties {
  string original_contents = 1;
  string key = 2;
  string new_value = 3;
  string expected_new_contents = 4;
  bool append_if_missing = 5;
}