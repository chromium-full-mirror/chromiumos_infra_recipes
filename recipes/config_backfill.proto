syntax = "proto3";

package recipes.chromeos.config_backfill;

message ConfigBackfillProperties {
    // Tuple of repo url and path inside a repo
    message RepoPath {
        string repo = 1; // URL to git repo
        string path = 2; // path inside repo
    }

    message ProjectConfig {
        string   public_yaml_path = 1; // path to public model.yaml relative to src/overlays
        RepoPath private_yaml = 2;     // private model.yaml
        string   hwid_key     = 3;     // key for HWID database
        string   project_name = 4;     // project name
        string   program_name = 5;     // program name
    }

    repeated ProjectConfig configs = 7;

    // TODO(crbug.com/1193491): remove when migrated to new config
    // Destination repo for changes
    string dest_repo = 1 [deprecated = true];

    // Repo and path to public model.yaml (optional)
    RepoPath public_yaml = 2 [deprecated = true];

    // Repo and path to private model.yaml (optional)
    RepoPath private_yaml = 3 [deprecated = true];

    // Key for HWID database (optional)
    string hwid_key = 4 [deprecated = true];

    // When no input config data is available, the project
    // name to use when generating the output.
    string project_name = 5 [deprecated = true];

    // Program name
    string program_name = 6 [deprecated = true];
}