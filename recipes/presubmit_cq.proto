syntax = "proto3";

package recipes.chromeos.presubmit_cq;

import "go.chromium.org/luci/buildbucket/proto/common.proto";

message PresubmitCqProperties {
  // Passed to depot_tools/presubmit (Infra Presubmit). See
  // depot_tools/recipes/recipe_modules/presubmit/properties.proto for details.
  bool runhooks = 1;

  // Passed to depot_tools/presubmit (Infra Presubmit). See
  // depot_tools/recipes/recipe_modules/presubmit/properties.proto for details.
  // Passed to presubmit as timeout_s.
  int32 timeout_sec = 2;
}
