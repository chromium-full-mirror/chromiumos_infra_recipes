syntax = "proto3";

package recipes.chromeos.build_borealis_rootfs;

import "chromiumos/common.proto";

message BuildBorealisRootfsProperties {
  // Path to the version file to update.
  // Required
  string version_file = 1;

  // The package to generate CLs for.
  // Required
  chromiumos.PackageInfo package_info = 2;

  // Destination gs bucket where the VM image will be copied.
  // Required
  string destination_gs_bucket = 3;

  // Destination gs path where the VM image will be copied.
  // Required
  string destination_gs_path = 4;

  // The manifest branch to check out (e.g. 'release-R105-14989.B')
  // Defaults to main tip of tree if not specified.
  string manifest_branch = 5;
}
