syntax = "proto3";

package recipes.chromeos.config_postsubmit;

// NEXT ID: 10
message ConfigPostsubmitProperties {

  enum ActionTypes {
    // The regenerate suite scheduler action type.
    REGENERATE_SUITE_SCHEDULER = 0;

    // The flatten configs action type.
    FLATTEN_CONFIGS = 1;

    // The copy internal action type. Note that this action now only updates
    // device stability configs in UFS, it is named "COPY_TO_INTERNAL" for
    // legacy reasons.
    COPY_TO_INTERNAL = 2;

    // The replicate public config action type.
    REPLICATE_PUBLIC_CONFIG = 3;

    // Regenerate the test plan.
    REGENERATE_TEST_PLAN = 4;

    // Update Android configs from snapshot artifacts.
    UPDATE_ANDROID_CONFIG = 5;

    // Downloads the latest component_ids.star file for each project
    // listed in android_project_to_cros_path and commits the file to the
    // corresponding CrOS repo.
    UPDATE_COMPONENT_IDS = 6;
  }

  message ActionCLConfig {
    // Reviewers to add to the created CLs.
    repeated string reviewers = 1;

    // CCs to add to the created CLs.
    repeated string ccs = 2;

    // Topic to add to the created CLs.
    string topic = 3;

    // Hashtags to add to the created CLs.
    repeated string hashtags = 4;

    // Should the CLs created be sent to CQ (+2) immediately?
    bool send_to_cq = 5;

    // Should the CLs be abandoned immediately?
    bool abandon = 6;

    // Entirely skip the CL upload. This should be used in cases where the
    // staging service account doesn't have permission to create CLs.
    bool skip_upload = 7;
  }

  message AllowedRepo {
    string repo_name = 1; // all_projects_configs.json repo name
  }

  // Configures where the UPDATE_ANDROID_CONFIG step writes the configs
  // generated by a snapshot builder. At least one of write_to_program_repo and
  // project_repo_config must be set.
  message SnapshotBuilderConfig {
    message ProjectRepoConfig {
      // Optional allowlist of projects to write to dedicated project repos.
      // If empty, all projects generated by the builder are written.
      repeated string project_allowlist = 1;
    }

    // Whether to write combined configs of all projects to the program repo
    // (device/google/desktop/<program>).
    bool write_to_program_repo = 1;
    // If set, writes configs to dedicated project repos
    // (device/google/desktop/<project>).
    ProjectRepoConfig project_repo_config = 2;
  }

  // Map from ActionType string representation to ActionCLConfig.
  map<string, ActionCLConfig> cl_configs = 1;

  // List of allowed project repos to process.  We can end up with old repos
  // with out of date configs (think projects that were backfilled but are now
  // cancelled), which can break things.  Let's be explicit about which project
  // repos we're going to process.
  repeated AllowedRepo allowed_projects = 2;

  // Same with programs for program config joining
  repeated AllowedRepo allowed_programs = 3;

  // UFS environment to upload configs to, passed to the --env arg on the
  // config_to_datastore.py script. Default is "prod".
  string ufs_env = 4;

  // List of snapshot builders to monitor for the UPDATE_ANDROID_CONFIG action.
  repeated string snapshot_builders_to_monitor = 5;

  // List of snapshot builders that should have their generated configs written
  // to project repos. Otherwise all configs for the builder are written to a
  // single program repo.
  //
  // Deprecated: Use snapshot_builder_configs instead. Only used for builders
  // that don't have an entry in snapshot_builder_configs.
  repeated string project_repo_snapshot_builders = 6 [ deprecated = true ];

  // The Gerrit host to upload configs to in the UPDATE_ANDROID_CONFIG step.
  // Defaults to "googleplex-android" if not set.
  string android_host = 7;

  // Map from Android project name to CrOS repo path.
  // Expected format: {"moonstone": "src/project/galaxy/moonstone"}
  map<string, string> android_project_to_cros_path = 8;

  // Map from snapshot builder name (e.g. "targetA-snapshot") to its routing
  // config for the UPDATE_ANDROID_CONFIG step. Builders without an entry fall
  // back to project_repo_snapshot_builders. Only entries for builders in
  // snapshot_builders_to_monitor are used.
  //
  // Expected format:
  // {"targetA-snapshot": {"write_to_program_repo": true,
  //                       "project_repo_config": {
  //                           "project_allowlist": ["projectA"]}}}
  map<string, SnapshotBuilderConfig> snapshot_builder_configs = 9;
}
