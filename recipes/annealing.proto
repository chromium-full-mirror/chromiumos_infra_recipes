syntax = "proto3";

package recipes.chromeos.annealing;

import "go.chromium.org/luci/buildbucket/proto/common.proto";
message AnnealingProperties {
  // The name of the git branch to create snapshots on. Required.
  string manifest_ref = 1;

  // Whether or not to publish uprevs.
  bool publish_uprevs = 2;

  // If true, the snapshot commit message will not list Gerrit changes. This
  // property should only be set temporarily to get Annealing back in a good
  // state. For example, Annealing has not succeeded in a long time, so the
  // message length exceeds Git limits.
  bool disable_gerrit_commits_in_commit_message = 3;

  // Jobs to trigger based on gitiles commits.
  // Once the uprev is published, if any of the regexp triggers hit, then the
  // named job(s) will be launched with the new gitiles_commit.
  message PathTrigger {
    // The path of the repo, relative to workspace_path.
    string repo_path = 1;

    // Paths to pass to git log.  If empty, then trigger on any commit to the
    // repo.
    repeated string file_paths = 2;

    // The BB task to schedule.
    message Job {
      string project = 1;
      string bucket = 2;
      string builder = 3;
    }
    repeated Job jobs = 3;
  }
  repeated PathTrigger path_triggers = 4;

  // If this is a dry run, do not actually push the manifest ref.
  bool dry_run = 5;
}

// Annealing determines what Gerrit changes have landed since its last run,
// and uploads its findings to Isolate. This proto stores that data.
message SnapshotGerritChanges {
  // All Gerrit changes since the last snapshot.
  repeated buildbucket.v2.GerritChange gerrit_changes = 2;
}
