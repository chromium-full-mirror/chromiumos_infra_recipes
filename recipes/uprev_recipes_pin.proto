syntax = "proto3";

package recipes.chromeos.uprev_recipes_pin;

message UprevRecipesPinProperties {
  bool push = 1;

  enum Pin {
    UNSPECIFIED = 0;
    CHROMITE_HEAD = 1;
    SIGNING_DOCKER_IMAGE = 2;
    INFRAINFRA_GOLANG = 3;
  }
  Pin pin = 2;
}