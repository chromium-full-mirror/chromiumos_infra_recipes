syntax = "proto3";

package recipes.chromeos.qualbot_autoreleaser;

message QualbotAutoreleaserProperties {
  enum ReleaseStage {
    STAGE_UNSPECIFIED = 0;
    STAGE_STAGING = 1;
    STAGE_PROD = 2;
  }
  // Target release stage to execute (STAGE_STAGING or STAGE_PROD).
  ReleaseStage stage = 1;
  // If true, perform a dry run without updating CIPD.
  bool dry_run = 2;
  // Optional override for source ref (git ref for STAGE_STAGING; CIPD ref, tag,
  // or instance ID for STAGE_PROD).
  string source_ref = 3;
  // Optional override for target CIPD ref.
  string target_ref = 4;
  // If true, bypass the staging health gate when promoting to prod.
  bool force = 5;
}
