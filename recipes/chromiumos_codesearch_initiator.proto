syntax = "proto3";

package recipes.chromeos.chromiumos_codesearch_initiator;

message ChromiumosCodesearchInitiatorProperties {

  // The luci-scheduler jobs to trigger.
  repeated string child_jobs = 1;

  // The Git repository to index on Code Search.
  string codesearch_repo = 2;

  // The manifest repo that the Code Search builders should check out.
  string manifest_repo = 3;
}
