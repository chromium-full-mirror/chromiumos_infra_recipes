syntax = "proto3";

package recipes.chromeos.sync_key_value_store;

// A GitilesFile describes a file that can be accessed via Gitiles, such as a
// file in the ChromeOS source tree.
message GitilesFile {
  // Required. The Gerrit host, such as chromium.googlesource.com.
  string host = 1;

  // Required. The Gerrit project, such as chromiumos/chromite.
  string project = 2;

  // Required. The path to the file, such as api/controller/something.py.
  string path = 3;

  // The ref to return the file from. Default: HEAD.
  string ref = 4;
}

// A KeyPair names a key in the source file and a key in the
// dest file. The value of the source key in the source file
// will be copied into the dest key in the dest file.
message KeyPair {
  // Required. The name of the key in the source file to read.
  string source_key = 1;
  // Required. The name of the key in the dest file to copy into.
  string dest_key = 2;

  // If True, and if dest_key is not found in dest_uri,
  // then the key will be appended to the destination file.
  // If False and dest_key is missing, then an error will be raised.
  bool append_if_dest_key_missing = 3;
}

message SyncKeyValueStoreProperties {
  // Required. The source file to read a value from.
  GitilesFile source_gitiles_file = 1;

  // Required. Full remote URI to the GS:// file to modify.
  // Example: gs://chromiumos-sdk/cros-sdk-latest.conf
  string dest_uri = 2;

  // Required. Keys to sync from the source file to the dest file.
  repeated KeyPair key_pairs = 3;

  // If True, then the remote file will not actually be pushed.
  bool dryrun = 4;
}