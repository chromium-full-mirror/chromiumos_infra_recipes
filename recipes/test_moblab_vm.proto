syntax = "proto3";

package recipes.chromeos.test_moblab_vm;

import "testplans/generate_test_plan.proto";

message TestMoblabVmProperties {
  // A unique name for the test, used to record test results.
  string name = 1;

  // The build payload to test.
  testplans.BuildPayload build_payload = 4;
}
