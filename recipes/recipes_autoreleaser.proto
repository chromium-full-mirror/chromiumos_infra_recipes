syntax = "proto3";

import "google/protobuf/timestamp.proto";

package recipes.chromeos.recipes_autoreleaser;

message RecipesAutoreleaserProperties {
  // Bundle to release. Required. See the --bundle arg on release.sh for
  // details on available bundles.
  string bundle = 1;

  // Actually push CIPD refs.
  bool push = 2;
}

// Used to communicate results between the release.sh script and the
// autoreleaser. The release.sh is sometimes called manually, so the logic to
// do the release needs to be ourside this recipe. However, the script needs a
// way to communicate structured results back to this recipe.
//
// The recipe can access the python bindings generated by the recipes engine in
// the standard way. When the release.sh script needs updated bindings, just
// copy them over manually:
// $ cp .recipe_deps/_pb3/PB/recipes/chromeos/recipes_autoreleaser.py recipes_release/protos
message ReleaseResult {
  // Contents of the announcement email created by the release.sh script (note
  // that the script may not have actually sent the email, depending on the
  // options passed).
  message AnnouncementEmail {
    string subject = 1;
    string body = 2;
  }
  AnnouncementEmail announcement_email = 1;

  message GitCommit {
    // The commit hash.
    string hash = 1;

    // The author, before the "@". I.e. if the author is "user1@google.com" this
    // field is "user1".
    string author = 2;

    // The subject line of the commit message (i.e. the first line).
    string subject = 3;

    // The date of the commit, relative to the time the release script was run.
    // See the "%cr" placeholder in the git format string:
    // https://git-scm.com/docs/git-log#Documentation/git-log.txt-emcrem
    string relative_date = 4;

    // The first recipes bundle CIPD instance that contains this commit.
    string cipd_instance = 5;
  }

  // Commits released in this execution of the script. Note that if the script
  // was run in dry-run mode, the commits won't have actually been released.
  // Changes are returned sorted newest to oldest.
  repeated GitCommit released_commits = 2;
}