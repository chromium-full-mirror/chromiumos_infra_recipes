syntax = "proto3";

package recipes.chromeos.build_chromiumos;

message BuildChromiumosProperties {
  // GS bucket to upload LATEST files to, e.g. chromeos-image-archive.
  string latest_files_gs_bucket = 1;

  // GS path (or template) to upload LATEST files to, e.g. {target}-public.
  string latest_files_gs_path = 2;
}