syntax = "proto3";

package recipes.chromeos.local_manifest_presubmit;

import "project_mgmt/project.proto";

message LocalManifestPresubmitProperties {
  // Project we want to run the presubmits of,
  // (e.g. "chromiumos/config" or "chromeos/project/volteer/halvor")
  string project = 1;

  // TODO(crbug.com/1058171): Update comment once local manifests are used for
  // all builds
  repeated string manifest_groups = 2;

  // Local manifest to add to the checkout.
  project_mgmt.LocalManifest local_manifest = 3;
}
