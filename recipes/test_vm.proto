syntax = "proto3";

package recipes.chromeos.test_vm;

import "chromiumos/common.proto";
import "chromite/api/test.proto";
import "testplans/generate_test_plan.proto";

message TestVmProperties {
  // A unique name for the test, used to record test results.
  string name = 1;

  // The build target under test.
  chromiumos.BuildTarget build_target = 2;

  // The test harness to use.
  chromite.api.VmTestRequest.TestHarness test_harness = 3;

  // The build payload to test.
  testplans.BuildPayload build_payload = 4;

  // Expressions describing tests to run. For autotest, this is typcally of
  // the form "suite:name". For tast, it is either a test name ("example.Pass")
  // or involves tast attributes (see go/tast-attr).
  repeated string expressions = 5;
}
