syntax = "proto3";

package recipes.chromeos.tast_vm;

import "chromiumos/common.proto";
import "testplans/generate_test_plan.proto";

message TastVmProperties {
  // A unique name for the test, used to record test results.
  string name = 1;

  // The build target under test.
  chromiumos.BuildTarget build_target = 2;

  // The build payload to test.
  testplans.BuildPayload build_payload = 3;

  // Expressions describing tests to run. It is either a test name
  // ("example.Pass") or involves tast attributes (see go/tast-attr).
  repeated string expressions = 4;

  // TotalShards is the total number of shards to be used in a test run.
  // Note: Each build will only run one shard. It is up to the caller to
  // schedule one build per shard with the appropriate shard_index values.
  int64 total_shards = 5;

  // ShardIndex specifies the index of the shard to used in the current run.
  // Note: This value is 0-indexed.
  int64 shard_index = 6;
}
