syntax = "proto3";

package recipes.chromeos.build_sdk;

import "recipes/chromeos/generator.proto";

message BuildSDKProperties {
  // Whether to build the SDK with the llvm-next USE flag
  bool use_llvm_next = 1;

  // Override the default version, which is used for GS:// filepaths.
  // Default: Build start timestamp, formatted as "%Y.%m.%d.%H%M%S"
  string version = 2;

  // If true, then the builder will upload to URIs with `staging/` prepended
  // (after the GS:// bucket). For example, a file that would normally be
  // uploaded to gs://chromiumos-sdk/cros-sdk-latest.conf will instead be
  // uploaded to gs://chromeos-sdk/staging/cros-sdk-latest.conf.
  // This will happen regardless of whether the builder is prod or staging.
  bool upload_to_staging_dir = 3;

  // Whether this build should launch a PUpr build to uprev the SDK version file
  // and amd64-host prebuilt file.
  // If False, then the generated artifacts will not affect production at all.
  bool launch_pupr = 4;

  // Which branch this build should checkout and build an SDK for.
  // This also affects which branch the launched PUpr build will uprev on.
  // Default: Check out the latest snapshot, and build an SDK for main.
   string manifest_branch = 5;

  // If given, override the PUpr builder's BranchPolicies with just this one.
  // This enables us, for example, to launch a PUpr job on `main` with a
  // different SendToCqPolicy or with additional reviewers.
   generator.BranchPolicy pupr_branch_policy = 6;
}
