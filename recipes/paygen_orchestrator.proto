syntax = "proto3";

package recipes.chromeos.paygen_orchestrator;

import "chromiumos/common.proto";

message PaygenOrchestratorProperties {
  // Builder name corresponding to paygen.json's convention.
  // See: gs://chromeos-build-release-console/paygen.json
  string builder_name = 1;

  // The version the builder\caller wants payloads to update to.
  // e.g. "13020.54.0".
  string target_chromeos_version = 2;

  // The delta types to generate for, empty for all.
  repeated chromiumos.DeltaType delta_types = 3;

  // The payload channels to generate for, empty requires DeltaType == NO_DELTA.
  repeated chromiumos.Channel channels = 4;

  // The bucket to look for source artifacts in (e.g, chromeos-releases).
  string src_bucket = 5;

  // The bucket to place resulting artifacts in (e.g.
  // chromes-throw-away-bucket).
  string dest_bucket = 6;

  // Should we not upload any generated artifacts or make other mutations.
  bool dryrun = 7;

  // Enumeration on whether or not to override the configured defaults.
  enum PayloadTestsOverride {
    RESPECT_CONFIG = 0;
    FORCE_TESTS = 1;
    FORCE_NO_TESTS = 2;
  }

  // Should we override the configured delta testing policy?
  PayloadTestsOverride delta_payload_test_override = 8;

  // Should we override the configured full testing policy?
  PayloadTestsOverride full_payload_test_override = 9;
}
