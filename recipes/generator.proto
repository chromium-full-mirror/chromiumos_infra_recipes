syntax = "proto3";

package recipes.chromeos.generator;

import "chromiumos/common.proto";
import "go.chromium.org/luci/scheduler/api/scheduler/v1/triggers.proto";

message G3OncallRotation {
  // The name of the oncall rotation, e.g. chromeos-sheriffs-west.
  string name = 1;

  // The rotation position.
  enum Position {
    UNSPECIFIED = 0;
    PRIMARY = 1;
    SECONDARY = 2;
    PRIMARY_AND_SECONDARY = 3;
  }
  Position position = 2;
}

// A reviewer must be some user known by Gerrit. Could be an email
// alias that is processed by GWS.
message Reviewer {
  string email = 1;
}

// Describes how to send a CL to CQ (i.e., dry run, .
enum SendToCqPolicy {
  // Policy was not specified
  UNSPECIFIED = 0;

  // Leave the CL be, add no tags.
  DO_NOTHING = 1;

  // Send the CL through a CQ dry run, but not the real deal.
  DRY_RUN = 2;

  // Send the CL through the full CQ.
  FULL_RUN = 3;

  // Abandon the CL.
  ABANDON = 4;

  // Submit the CL directly.
  SUBMIT = 5;
}

// Describes what to do when PUpr finds CLs that are still open but
// behind a merged version of the same target.
enum OutdatedClsPolicy {
  // Policy was not specified
  OUTDATED_UNSPECIFIED = 0;

  // Leave the CL be, just log queries in steps.
  OUTDATED_DO_NOTHING = 1;

  // Leave a comment on the CL that it might be abandoned.
  OUTDATED_LEAVE_COMMENT = 2;

  // Abandon the CL.
  OUTDATED_ABANDON = 3;
}

// Describes how PUpr should retry existing open CLs that have failed.
enum RetryClPolicy {
  // No retries (default).
  NO_RETRY = 0;

  // Retry with default behavior -- either the most recent CL with the hashtag
  // #pupr-retry-pinned is retried, or in the absence of such a hashtag,
  // the most recent open CL is retried. Note that retries only happen
  // when EXISTING_CLS_POLICY != FULL_RUN.
  RETRY_LATEST_OR_LATEST_PINNED = 1;

  // Retries will only occur for the most recent CL pinned #pupr-retry-pinned,
  // again with the caveat that retries will not occur if EXISTING_CLS_POLICY
  // is not FULL_RUN.
  RETRY_LATEST_PINNED = 2;
}

// Ref to use for scheduled retries.
// Pupr runs more often than necessary to look for failed CLs to retry.
// This ref points to the repository containing retry-able CLs, i.e.
// the repository containing the .ebuild files that are updated on uprev.
message RetryRef {
  // Remote, e.g. "cros" or "cros-internal".
  string remote = 1;

  // Project name, e.g. "chromiumos/overlays/chromiumos-overlay"
  string name = 2;

  // Ref, e.g. "refs/heads/main".
  string ref = 3;

  // Project path, e.g. "src/third_party/chromiumos-overlay"
  string path = 4;
}

message BranchPolicy {
  // The first BranchPolicy in the list to match the tag will be the one used.
  //
  // For this BranchPolicy to match:
  // - re.match(pattern) must match the gitiles trigger reference, and
  // - re.sub(pattern, repl) must produce ${RESULT} of:
  //   - such that `git ls-remote ${INTENRAL_MANIFEST} ${RESULT}` returns
  //   exactly one reference, which will be used.
  //   - if ${RESULT} returns more than one reference, StepFailure is raised.
  //   - if ${RESULT} returns no references, the policy is skipped.
  //
  // Note that the gitiles trigger will use a reference from the
  // repository that triggered the generator run, while the result of
  // re.sub(pattern, repl) must be the name of a branch in the
  // internal manifest repo. This conversion is necessary to allow
  // generators to take triggers from repos that are not owned by
  // Chrome OS, and from new tags.
  //
  // However, even if you are triggering from a Chrome OS repo and
  // attempting an uprev on the same manifest branch, these can have
  // different names. For example, the Linux kernel repo is checked
  // out multiple times, so each manifest branch actually has multiple
  // kernel repo branches associated with it. You should check the
  // policy for reference names for your specific repo carefully.
  //
  // TODO(crbug/1126855): Delete this paragraph once transition is finished.
  // In particular, while the master -> main conversion is ongoing,
  // some Chrome OS repositories will have a mismatch between the
  // names of the primary manifest branch and the primary repository
  // branch.
  //
  // To generically specify a mapping for Chrome version to Chrome OS release
  // branch, such that 'refs/tags/86.0.4240.33' maps to 'release-R86-13421.B',
  // use pattern='refs/tags/([0-9]*).*' and repl='release-R\1-*.B'.
  //
  // To specify a default of 'snapshot', use pattern='.*', and repl='snapshot'.
  //
  // To specify no branch (tip of cache) use repl=''.

  // Regexp pattern for matching and converting a trigger.ref.
  string pattern = 1;

  // Should we completely ignore this ref and return success for this trigger?
  // Overrides all Policies and subsequent configuration.
  bool ignore = 9;

  // Regexp replacement for converting a trigger.ref to a reference.
  string repl = 2;

  // The reviewer(s) to tag on generated CLs.
  repeated Reviewer reviewers = 3;

  // Tag to add to all generated CLs. Defaults to qualified package name.
  string topic = 4;

  // Policy to follow when no related CLs exist. Defaults to DO_NOTHING.
  SendToCqPolicy no_existing_cls_policy = 5;

  // Policy to follow when related CLs exist. Defaults to DO_NOTHING.
  SendToCqPolicy existing_cls_policy = 6;

  // Policy to follow when for CLs that are still open but behind a merge.
  OutdatedClsPolicy outdated_cls_policy =  7;

  // Policy to follow for retrying open failed CLs.
  RetryClPolicy retry_cl_policy = 8;
}

// Holds information needed for packages who need to fetch a file from the
// Gitiles API.
message GitilesFetchInfo {
  // Gerrit host to use. e.g chromium or chrome-internal
  string host = 1;

  // Gerrit project to target.
  string project = 2;

  // Path to the file, relative to project root.
  string path = 3;
}

message GeneratorProperties {
  // The package to generate CLs for.
  repeated chromiumos.PackageInfo packages = 15;

  // Whether to generate CLs when either of the packages had no modified file.
  bool allow_partial_uprev = 17;

  // The package to generate CLs for.
  // Deprecated. Use packages instead.
  chromiumos.PackageInfo package_info = 1 [deprecated = true];

  reserved 2 to 5, 9, 10;

  // The build targets to uprev. Only populate if required by endpoint.
  repeated chromiumos.BuildTarget build_targets = 6;

  // Whether or not the generator should initialize the sdk before
  // invoking the uprevving endpoint. As the init takes a bit of time,
  // it should be avoided unless it is required.
  bool init_sdk = 7;

  // Triggers if invoked directly rather than through a gitiles poller.
  // Note that the recipe only processes the Trigger.GitilesTrigger fields.
  repeated scheduler.Trigger triggers = 8;

  // Policies for branches.  If none of these match, then the properties above
  // are used, on the default (usually 'snapshot') branch.
  // The lack of branch_policies disables checking out a branch.
  repeated BranchPolicy branch_policies = 11;

  // Ref to use for scheduled retries.
  RetryRef retry_ref = 12;

  // Retrieval information required by the Gitiles API.
  // If set this will fetch the version file and overwrite the revision field in
  // git ref sent to the uprev handler.
  GitilesFetchInfo gitiles_info = 14;

  // The topic name to be set to the generated change.
  // When empty, automatically generated from package_info or the first element
  // of packages, by formatting it to "{category}/{package}[-{version}]".
  // Also, this can be overridden by topic_name in branch_policies.
  // If CLs are generated by a staging PUpr, "staging/" prefix is added.
  string topic = 16;
}
