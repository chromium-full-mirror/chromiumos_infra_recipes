syntax = "proto3";

package recipes.chromeos.manifest_doctor;

message ManifestDoctorProperties {
    // Cipd ref to use for manifest_doctor.
    // Defaults to "chromiumos/infra/manifest_doctor/{$platform}".
    string manifest_doctor_cipd_package = 1;

    // Cipd ref to use for manifest_doctor.
    // Defaults to "staging" or "prod".
    string manifest_doctor_cipd_ref = 2;

    // Whether or not to push changes to remotes, i.e. whether or not the run
    // is a dry run.
    bool push = 3;

    // Minimum milestone to consider for local manifest branching.
    int32 min_milestone = 4;

    // Paths within the internal buildspec GS bucket to mirror to external
    // buildspec bucket.
    repeated string buildspec_watch_paths = 5;
}
