syntax = "proto3";

package recipes.chromeos.gardener_data_collector;

message GardenerDataResult {
  message Commit {
    // The change number.
    int64 number = 1;

    // Timestamp of when the change was created.
    string created = 2;

    // Timestamp of when the change was merged.
    string submitted = 10;

    string branch = 3;

    // The subject of the change (header line of the commit message).
    string subject = 4;

    string status = 5;

    // The numeric Change-Id of the change that this change reverts.
    int64 revert_of = 6;

    // The number of time the change has been CQ+1 or CQ+2.
    int64 cq_tries = 7;

    // The version string before and after the uprev commit.
    string old_version = 8;
    string new_version = 9;
  }

  message ChromeRevision {
    int64 commit_position = 1;
    string commit_hash = 2;
  }

  message FailingTest {
    string test_id = 1;
    string test_name = 2;
    string builder = 3;
    ChromeRevision good = 4;
    ChromeRevision bad = 5;
    int64 first_failure_build_id = 6;
    bool exonerated = 7;
  }

  repeated Commit chrome_uprev_commits = 1;
  repeated Commit lkgm_commits = 2;
  repeated FailingTest failing_ci_tests = 3;
}

message GerritQueryCondition {
  message Term {
    string key = 1;
    string value = 2;
  }

  // A situation is a set of terms that are ANDed together.
  message Situation { repeated Term terms = 1; }

  // A list of situations that are ORed together.
  repeated Situation situations = 1;

  // Optional age parameter in days (e.g. 7, 14, 30). Defaults to 7 if 0.
  int32 age_days = 2;

  // Optional merged hours parameter. If > 0, merged queries search for changes
  // merged in the past N hours instead of using age_days.
  int32 merged_hours = 3;

  // Optional multi-level ordering for output commits.
  // Each entry can be like "+branch", "-submitted", "-new_version", where
  // leading '-' specifies descending and '+' (or no prefix) specifies
  // ascending.
  repeated string ordering = 4;
}

message GardenerDataCollectorProperties {
  reserved 3; // was disable_failing_ci_tests
  bool disable_chrome_uprev_commits = 1;
  bool disable_lkgm_uprev_commits = 2;
  GerritQueryCondition lkgm_query_condition = 4;
  GerritQueryCondition chrome_uprev_query_condition = 5;
}
